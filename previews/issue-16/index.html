<!doctype html><html lang='zh-CN'><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'; object-src 'none';"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>供应商同步管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#25332d;font:15px/1.6 system-ui,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:880px;margin:24px auto;padding:20px;background:#fff;border:1px solid #dfe6e2;border-radius:12px}h1{font-size:20px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:8px 10px;border:1px solid #c5d3cc;border-radius:8px;background:#fff;max-width:100%}button{background:#e6efea;color:#214a3a;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.card{margin-top:14px;padding:12px;border:1px solid #e3eae6;border-radius:10px}.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef3f0}.ok{color:#1d6a4a}.warn{color:#8a5a00}.err{color:#a02828}.muted{color:#6b7a73;font-size:13px}.book{padding:8px 0;border-bottom:1px solid #eef2ef;word-break:break-all}.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}@media(max-width:480px){main{margin:8px;padding:12px}}</style></head><body><main><h1>供应商同步管理</h1><div class='row'><label>供应商 <select id='supplier'></select></label><label>模拟场景 <select id='mode'><option value='mixed'>混合非法记录</option><option value='ok'>正常同步</option><option value='empty'>空数据</option><option value='fail'>API 失败</option></select></label><button id='sync'>同步</button><button id='retry' hidden>重试续跑</button></div><div class='card' id='status' aria-live='polite'></div><div class='card'><div class='row'><strong>书目</strong><span class='muted' id='count'></span></div><div id='books'></div><div class='row' style='margin-top:8px'><button id='more' hidden>加载更多</button></div></div><div class='card'><button id='errBtn'>查看错误明细</button><div id='errors' hidden></div></div></main><script>var SUP=[{id:'gutendex-sim',name:'Gutendex 模拟供应商',mode:'simulated',enabled:true}];var B2=[{externalId:'1342',title:'Pride and Prejudice',authors:['Austen, Jane'],language:'en',supplierId:'gutendex-sim',pageId:'pg_3f9a1c2b7d4e5f60'},{externalId:'84',title:'Frankenstein; Or, The Modern Prometheus',authors:['Shelley, Mary Wollstonecraft'],language:'en',supplierId:'gutendex-sim',pageId:'pg_3f9a1c2b7d4e5f60'}];var LABEL={running:'同步中',paused:'已暂停可续跑',succeeded:'已完成',partial_failed:'部分失败',failed:'失败'};var REASON={MISSING_EXTERNAL_ID:'缺少 externalId',MISSING_TITLE:'缺少书名'};var RES={ok:{s:200,b:{batchId:'7a1d2e3f-4b5c-4d6e-8f70-1a2b3c4d5e6f',supplierId:'gutendex-sim',status:'succeeded',pagesApplied:1,successCount:2,failedCount:0,nextPageToken:null,errors:[]}},mixed:{s:200,b:{batchId:'3f2b8c1e-6a4d-4b7e-9c1a-2d5e8f9a0b11',supplierId:'gutendex-sim',status:'partial_failed',pagesApplied:1,successCount:2,failedCount:1,nextPageToken:null,errors:[{externalId:null,pageId:'pg_3f9a1c2b7d4e5f60',reason:'MISSING_EXTERNAL_ID'}]}},empty:{s:200,b:{batchId:'9c0e1f2a-3b4c-4d5e-9f60-7a8b9c0d1e2f',supplierId:'gutendex-sim',status:'succeeded',pagesApplied:1,successCount:0,failedCount:0,nextPageToken:null,errors:[]}},fail:{s:502,b:{code:'UPSTREAM_UNAVAILABLE',message:'供应商暂不可用，已重试 3 次，可重试续跑',batchId:'5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b'}},retry:{s:200,b:{batchId:'5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b',supplierId:'gutendex-sim',status:'partial_failed',pagesApplied:1,successCount:2,failedCount:1,nextPageToken:null,errors:[{externalId:null,pageId:'pg_3f9a1c2b7d4e5f60',reason:'MISSING_EXTERNAL_ID'}]}}};var S={batchId:'3f2b8c1e-6a4d-4b7e-9c1a-2d5e8f9a0b11',status:'partial_failed',successCount:2,failedCount:1,pagesApplied:1,errors:RES.mixed.b.errors,resume:null};var books=B2,total=2,offset=2;function $(i){return document.getElementById(i)}function esc(v){return String(v==null?'':v).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function renderStatus(){var cls=S.status==='succeeded'?'ok':(S.status==='partial_failed'||S.status==='paused'?'warn':'err');$('status').innerHTML='<div class=\'row\'><span class=\'badge '+cls+'\'>'+(LABEL[S.status]||S.status)+'</span><span class=\'muted\'>批次 '+esc(S.batchId||'-')+'</span></div><div class=\'stats\'><span>成功 <b class=ok>'+S.successCount+'</b></span><span>失败 <b class=err>'+S.failedCount+'</b></span><span>已应用页 '+S.pagesApplied+'</span></div>'}function renderBooks(){var list=books;$('count').textContent='共 '+total+' 条';if(!list.length){$('books').innerHTML='<p class=muted>暂无书目，请先同步</p>';$('more').hidden=true;return}$('books').innerHTML=list.map(function(b){return '<div class=book><b>'+esc(b.title)+'</b><div class=muted>作者 '+esc(b.authors.join(' / '))+' · externalId '+esc(b.externalId)+' · 语言 '+esc(b.language)+' · pageId '+esc(b.pageId.slice(0,10))+'…</div></div>'}).join('');$('more').hidden=list.length>=total}function renderErrors(){var e=S.errors||[];$('errors').innerHTML=e.length?e.map(function(x){return '<div class=book>externalId '+esc(x.externalId||'缺失')+' · '+esc(REASON[x.reason]||x.reason)+' · pageId '+esc(x.pageId)+'</div>'}).join(''):'<p class=muted>无错误</p>'}function apply(b){S.batchId=b.batchId;S.status=b.status;S.successCount=b.successCount;S.failedCount=b.failedCount;S.pagesApplied=b.pagesApplied;S.errors=b.errors;renderStatus();renderErrors()}function call(mode,resume,cb){var r=mode==='retry'?RES.retry:RES[mode];setTimeout(function(){cb(r)},400)}function setBusy(v){$('sync').disabled=v;$('retry').disabled=v;$('status').setAttribute('aria-busy',v)}function showError(b){S.batchId=b.batchId;S.status='paused';$('status').innerHTML='<div class=err>'+esc(b.message)+'（code '+esc(b.code)+'）</div><div class=muted>批次 '+esc(b.batchId)+'</div>';$('retry').hidden=false}$('supplier').innerHTML=SUP.map(function(s){return '<option value='+s.id+'>'+esc(s.name)+'</option>'}).join('');$('errors').hidden=true;$('errBtn').onclick=function(){$('errors').hidden=!$('errors').hidden};renderStatus();renderBooks();renderErrors();$('sync').onclick=function(){setBusy(true);$('status').textContent='同步中…';var m=$('mode').value;call(m,null,function(r){setBusy(false);if(r.s===200){$('retry').hidden=true;apply(r.b);books=m==='empty'?[]:B2;total=books.length;offset=books.length;renderBooks()}else{showError(r.b)}})};$('retry').onclick=function(){setBusy(true);$('status').textContent='续跑中…';call('retry',S.batchId,function(r){setBusy(false);$('retry').hidden=true;apply(r.b);books=B2;total=2;offset=2;renderBooks()})};$('more').onclick=function(){$('more').disabled=true;setTimeout(function(){$('more').disabled=false;$('more').hidden=true},300)};</script></body></html>
