<!doctype html><html lang='zh-CN'><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'; object-src 'none';"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>供应商同步</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#25332d;font:15px/1.6 system-ui,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:880px;margin:24px auto;padding:20px;background:#fff;border:1px solid #dfe6e2;border-radius:12px}h1{font-size:20px;margin:0 0 8px}h2{font-size:16px;margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}select,button{font:inherit;padding:8px 10px;border:1px solid #c5d3cc;border-radius:8px;background:#fff;max-width:100%}button{background:#e6efea;color:#234c3c;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.card{border:1px solid #e1e8e4;border-radius:10px;padding:12px;margin-top:12px}.muted{color:#66766e;font-size:13px}.err{color:#9a3b2e}.ok{color:#2d6a4f}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #e8eee9;padding:6px;text-align:left}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.stats div{background:#f3f7f5;border-radius:8px;padding:8px;text-align:center}@media (max-width:390px){.stats{grid-template-columns:repeat(2,1fr)}main{margin:8px;padding:12px}}</style></head><body><main><h1>供应商同步</h1><p class='muted'>离线原型：使用与 API 示例一致的本地模拟数据，不调用真实接口。接口与字段映射见 BIND-01 至 BIND-05。</p><div class='row'><label>供应商 <select id='supplier'></select></label><label>模拟场景 <select id='mode'><option value='mixed'>混合非法记录（2 成功 1 失败）</option><option value='upstream'>API 失败 502</option><option value='empty'>空数据</option></select></label><button id='sync'>同步</button></div><div class='card'><h2>批次状态</h2><div id='status' class='muted' aria-live='polite'>就绪</div><div class='stats'><div>成功<br><b id='succ'>-</b></div><div>失败<br><b id='fail'>-</b></div><div>页数<br><b id='pages'>-</b></div><div>还有下页<br><b id='more'>-</b></div></div></div><div class='card'><h2>书目结果</h2><div id='books'></div><div class='row'><button id='prev' disabled>上一页</button><span id='pg' class='muted'></span><button id='next' disabled>下一页</button></div></div><div class='card'><h2>错误明细</h2><button id='errBtn'>查看错误明细</button><div id='errs' class='muted'></div></div></main><script>var SUP=[{supplierId:'gutendex-sim',displayName:'Gutendex 模拟供应商',mode:'simulated'}];var BOOKS=[{bookId:1,externalId:'1342',title:'Pride and Prejudice',authorName:'Jane Austen',language:'en'},{bookId:2,externalId:'84',title:'Frankenstein',authorName:'Mary Shelley',language:'en'}];var SCEN={mixed:{ok:true,batch:{batchId:'bat_4f1c9a2e7b3d4e5f8a6b0c1d2e3f4a5b',supplierId:'gutendex-sim',status:'partial_failed',pagesApplied:2,successCount:2,failedCount:1,hasMore:false,lastPageId:'p_1c7e5b2d9a4f40e8b6d3c2a1f0e9d8c7',updatedAt:'2026-10-11T09:00:00Z'},books:BOOKS,errors:[{rawIndex:2,errorCode:'MISSING_EXTERNAL_ID',message:'缺少 externalId，已跳过入库',pageId:'p_9f3a0c1d2e4b5a6f7c8d9e0f1a2b3c4d'}]},upstream:{ok:false,err:{code:'UPSTREAM_UNAVAILABLE',message:'供应商暂不可用，请重试',batchId:'bat_4f1c9a2e7b3d4e5f8a6b0c1d2e3f4a5b'}},empty:{ok:true,batch:{batchId:'bat_0a1b2c3d4e5f60718293a4b5c6d7e8f9',supplierId:'gutendex-sim',status:'succeeded',pagesApplied:1,successCount:0,failedCount:0,hasMore:false,lastPageId:'p_0a0b0c0d0e0f0a0b0c0d0e0f0a0b0c0d',updatedAt:'2026-10-11T09:10:00Z'},books:[],errors:[]}};var cur=SCEN.mixed;var $=function(i){return document.getElementById(i)};function stat(b){$('status').innerHTML='状态：<b>'+b.status+'</b> · batchId '+b.batchId+' · 更新 '+b.updatedAt;$('succ').textContent=b.successCount;$('fail').textContent=b.failedCount;$('pages').textContent=b.pagesApplied;$('more').textContent=b.hasMore?'是':'否';}function bl(){var s=cur;if(!s.books.length){$('books').innerHTML='<p class=muted>暂无书目。本批次没有可入库的合法记录。</p>';}else{var h='<table><tr><th>externalId</th><th>书名</th><th>作者</th><th>语言</th></tr>';s.books.forEach(function(x){h+='<tr><td>'+x.externalId+'</td><td>'+x.title+'</td><td>'+(x.authorName||'-')+'</td><td>'+(x.language||'-')+'</td></tr>';});$('books').innerHTML=h+'</table>';}$('pg').textContent='第 1 页 · 共 '+s.books.length+' 条';}function run(){var sb=$('sync');sb.disabled=true;sb.textContent='同步中…';$('status').innerHTML='<span class=muted>加载中：POST /api/sync 请求已发出</span>';$('errs').textContent='';setTimeout(function(){var m=SCEN[$('mode').value];sb.disabled=false;sb.textContent='同步';if(!m.ok){cur=null;$('status').innerHTML='<span class=err>'+m.err.code+'：'+m.err.message+'</span> <button id=retry>重试</button>';$('succ').textContent='-';$('fail').textContent='-';$('pages').textContent='-';$('more').textContent='-';$('books').innerHTML='<p class=muted>错误状态：未展示新书目，保留上一次结果。</p>';$('retry').onclick=run;return;}cur=m;stat(m.batch);bl();},700);}SUP.forEach(function(x){$('supplier').innerHTML+='<option value='+x.supplierId+'>'+x.displayName+'</option>';});$('mode').onchange=function(){if($('mode').value==='empty'){$('status').innerHTML='空数据模式：点击同步查看结果';}};$('sync').onclick=run;$('errBtn').onclick=function(){if(!cur){$('errs').textContent='暂无批次';return;}var h='';cur.errors.forEach(function(e){h+='<p class=err>第 '+e.rawIndex+' 条：'+e.errorCode+'，'+e.message+'</p>';});$('errs').innerHTML=h||'<span class=ok>无错误明细</span>';};stat(cur.batch);bl();</script></body></html>
