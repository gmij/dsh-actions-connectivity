<!DOCTYPE html><html lang="zh-CN"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'; object-src 'none';"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>每周阅读计划</title><style>:root{--bg:#f5f2eb;--panel:#fffdf8;--text:#2f312f;--muted:#6c726c;--line:#ddd8cf;--green:#4e8a5a;--green-2:#dceadf;--error:#b34d4d;--shadow:0 8px 24px rgba(47,49,47,.06);--radius:16px}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px}main{max-width:1040px;margin:0 auto}h1,h2,p{margin:0}h1{font-size:clamp(1.6rem,2.6vw,2.4rem);line-height:1.15;margin-bottom:10px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}.stack{display:grid;gap:12px}.books{display:grid;gap:12px}.book{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;min-width:0}.book-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:700;overflow-wrap:anywhere;word-break:break-word;min-width:0}.meta{color:var(--muted);font-size:.92rem}.bar{height:10px;background:#eee7db;border-radius:999px;overflow:hidden;margin-top:10px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#76b27f);width:0;transition:width .25s ease}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:focus,.field:focus{outline:3px solid rgba(78,138,90,.22);outline-offset:2px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);font:inherit}.field::placeholder{color:#9ba19b}.form-grid{display:grid;gap:10px}.form-row{display:grid;gap:6px}.label{font-weight:600}.status{border-left:4px solid var(--green);background:var(--green-2);padding:12px 14px;border-radius:12px;color:#26442d;min-height:52px}.status.error{border-left-color:var(--error);background:#f8e8e8;color:#7a3030}.note{font-size:.92rem}.small{font-size:.92rem;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#eef4ef;color:#35573d;padding:5px 10px;font-size:.85rem}.complete{color:var(--green);font-weight:700}@media (max-width:860px){.grid{grid-template-columns:1fr}}@media (max-width:520px){body{padding:14px}.card{padding:14px}.book-head{flex-direction:column}.actions{flex-direction:column}.btn{width:100%}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}.bar>span{transition:none}.btn,.field{transition:none}}</style></head><body><main><section class="stack" aria-label="每周阅读计划"><header class="card"><span class="badge">演示数据 · 离线原型</span><h1>每周阅读计划</h1><p>查看示例书单、添加新书、记录已读页数，并在完成时获得清晰反馈。所有输入仅本地处理，不连接后端。</p></header><div class="grid"><section class="card stack"><div><h2>示例书单</h2><p class="small">下面是演示计划，包含进度与完成状态。</p></div><div class="books" id="bookList"></div></section><aside class="card stack"><div><h2>添加书籍</h2><p class="small">书名必填，页数必须是正整数。</p></div><form id="addForm" class="form-grid" novalidate><div class="form-row"><label class="label" for="bookTitle">书名</label><input class="field" id="bookTitle" name="bookTitle" maxlength="80" placeholder="例如：在轮船上的小镇 &lt;示例&gt;"></div><div class="form-row"><label class="label" for="bookPages">总页数</label><input class="field" id="bookPages" name="bookPages" inputmode="numeric" pattern="[0-9]*" placeholder="例如：240"></div><button class="btn primary" type="submit">添加到计划</button></form><div id="feedback" class="status" role="status" aria-live="polite">请选择示例书或添加一本新书开始。</div></aside></div></section></main><script>(()=>{const state={books:[{id:1,title:"《如何阅读一本书》",pages:320,read:96},{id:2,title:"《切换到专注》",pages:208,read:208},{id:3,title:"《城市里的慢生活》",pages:180,read:40}],nextId:4};const list=document.getElementById("bookList");const feedback=document.getElementById("feedback");const addForm=document.getElementById("addForm");const titleInput=document.getElementById("bookTitle");const pagesInput=document.getElementById("bookPages");const esc=s=>s.replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const setStatus=(msg,isError=false)=>{feedback.className="status"+(isError?" error":"");feedback.textContent=msg};const render=()=>{list.innerHTML="";state.books.forEach(book=>{const pct=Math.min(100,Math.round(book.read/book.pages*100));const item=document.createElement("article");item.className="book";item.innerHTML=`<div class="book-head"><div class="title">${esc(book.title)}</div><div class="meta">${book.read}/${book.pages} 页 · ${pct}%${book.read>=book.pages?'<span class="complete"> · 已完成</span>':''}</div></div><div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div><div class="actions"><button class="btn" data-action="read" data-id="${book.id}">记录进度</button></div>`;list.appendChild(item)})};list.addEventListener("click",e=>{const btn=e.target.closest("button[data-action=read]");if(!btn)return;const book=state.books.find(b=>b.id===Number(btn.dataset.id));const value=prompt(`为《${book.title}》输入已读页数（0-${book.pages}）：`,String(book.read));if(value===null)return;const n=Number(value);if(!Number.isInteger(n)||n<0||n>book.pages){setStatus("请输入 0 到总页数之间的整数。",true);return}book.read=n;render();setStatus(n>=book.pages?`《${book.title}》已完成，恭喜！`: `已更新《${book.title}》进度到 ${n}/${book.pages} 页。`,false)});addForm.addEventListener("submit",e=>{e.preventDefault();const title=titleInput.value.trim();const pages=Number(pagesInput.value);if(!title){setStatus("书名不能为空。",true);titleInput.focus();return}if(!Number.isInteger(pages)||pages<=0){setStatus("总页数必须是正整数。",true);pagesInput.focus();return}state.books.unshift({id:state.nextId++,title,pages,read:0});render();setStatus(`已添加《${title}》到计划。`,false);addForm.reset();titleInput.focus()});render()})();</script></body></html>
