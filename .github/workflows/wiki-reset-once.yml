name: Wiki reset once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wiki-reset-once.yml']
permissions:
  contents: read
concurrency:
  group: dsh-design-wiki
  cancel-in-progress: false
  queue: max
jobs:
  reset:
    if: contains(github.event.head_commit.message, '[wiki-reset-20261011]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve Home and delete all other Wiki files
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN || github.token }}
        run: |
          python - <<'PY'
          import hashlib, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from design_wiki import git
          repo = os.environ['GITHUB_REPOSITORY']
          with tempfile.TemporaryDirectory() as folder:
              work = Path(folder)
              git(work, 'clone', '--depth=1', f'https://github.com/{repo}.wiki.git', '.')
              home = work / 'Home.md'
              if not home.is_file() or home.is_symlink():
                  raise RuntimeError('Expected original Home.md; aborting reset')
              original = home.read_bytes()
              files = [p for p in git(work, 'ls-files', '-z').split('\0') if p]
              removed = [p for p in files if p != 'Home.md']
              print('Wiki files before reset:', len(files))
              print('Files to remove:', len(removed))
              for name in removed:
                  print('Remove:', name)
              if removed:
                  git(work, 'rm', '--', *removed)
                  if home.read_bytes() != original:
                      raise RuntimeError('Home content changed; aborting reset')
                  git(work, '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'Reset Wiki for fresh design generation; preserve original Home')
                  git(work, 'push', 'origin', 'HEAD')
              remaining = [p for p in git(work, 'ls-files', '-z').split('\0') if p]
              if remaining != ['Home.md'] or home.read_bytes() != original:
                  raise RuntimeError('Reset verification failed')
              print('Verified only Home.md remains; original bytes preserved.')
              print('Home SHA256:', hashlib.sha256(original).hexdigest())
              print('Wiki commit:', git(work, 'rev-parse', 'HEAD').strip())
          PY
