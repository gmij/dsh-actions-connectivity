name: Staged design tests
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/staged_design.py'
      - 'scripts/ipc_stages.py'
      - 'scripts/design_delivery.py'
      - 'scripts/issue_agent.py'
      - 'tests/test_staged_*.py'
      - 'scripts/test_*.py'
      - '.github/workflows/staged-design-tests.yml'
  pull_request:
    paths:
      - 'scripts/staged_design.py'
      - 'scripts/ipc_stages.py'
      - 'scripts/design_delivery.py'
      - 'scripts/design_wiki.py'
      - 'scripts/test_typed_ipc_contract.py'
      - 'scripts/staged_prototype.py'
      - 'scripts/issue_agent.py'
      - 'tests/test_staged_*.py'
      - 'tests/test_staged_prototype.py'
      - '.github/workflows/staged-design-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staged design unit tests
        run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_staged_*.py' -v
      - name: Run complete design/Wiki contract regressions
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify Python syntax
        run: python -m py_compile scripts/staged_design.py scripts/ipc_stages.py scripts/staged_prototype.py scripts/issue_agent.py scripts/design_delivery.py scripts/design_wiki.py
